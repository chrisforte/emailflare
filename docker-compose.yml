services:

  emailflare:
    container_name: emailflare
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - /docker/config/emailflare:/data
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost/health" ]
      start_period: 15s
