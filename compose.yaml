name: emailflare

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8090}:80"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Embedded mesahub — start.sh spins up mesahub-server inside the container.
      # Override with mh://token@host:port/db to use an external instance instead.
      - MESAHUB_URL=${MESAHUB_URL:-mh://local/emailflare}
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-data:

